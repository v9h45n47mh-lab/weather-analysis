<style>body{margin:16px;background:#f5f6f8;font-family:Arial,sans-serif}body.dark{background:#111827;--ha-card-background:#1f2937;--primary-text-color:#f1f5f9;--secondary-text-color:#b4bdcb;--divider-color:#374151;--input-fill-color:#111827;--primary-color:#50b5fa;--ha-card-border-color:#374151}weather-analysis-card{display:block;max-width:760px;margin:auto}body:not(.dark){--primary-color:#0288d1}</style>
<weather-analysis-card></weather-analysis-card>
<script type="module">

 if(demo.gapEntity===msg.entity_id)chart=chart.filter((point,index)=>index<5||index>8);

 return {version:'1.16.1',kind:wind?'wind':lux?'illuminance':'temperature',unit:wind?'km/h':lux?'lx':'°C',entity_id:msg.entity_id,name:[...sensors,...windSensors,...illuminanceSensors].find(s=>s.entity_id===msg.entity_id)?.name||'Garten',timezone:'Europe/Berlin',current:wind?(secondary?28.8:18):lux?(secondary?3456.7:1234.6):11.4,last_updated:Date.now()/1000,start,end,display_end:requestedEnd,window:msg.window||null,partial:end<requestedEnd,

  comparisons:{previous:{mean:7.3,coverage:.97,delta:.8},year:{mean:9.4,coverage:.94,delta:-1.3}},trends:{hour:.8,three_hours:1.6,yesterday:-1.2},records:{min:{value:-12.3,at:null},max:{value:37.2,at:start-86400}},archive_since:start};
};
const locationFixture=(latitude=49.3806,longitude=8.3039)=>{

 return {location,timezone,source:'Open-Meteo',source_url:'https://open-meteo.com/',as_of:now,updated_at:Date.now()/1000,stale:false,
  days:[0,1].map(offset=>({date:new Intl.DateTimeFormat('en-CA',{timeZone:timezone}).format(new Date((midnight+offset*86400+43200)*1000)),label:offset?'Morgen':'Heute · Resttag',slots:Array.from({length:8},(_,i)=>{
   const begin=midnight+offset*86400+i*10800,end=begin+10800,start=Math.max(begin,now);

   const hours=Array.from({length:3},(_,j)=>record(Math.max(begin+j*3600,now),begin+(j+1)*3600,j)).filter(h=>h.end>h.start);
   return {...record(start,end),wind_speed:12+i,wind_gusts:42,hours};
  }).filter(slot=>slot.end>now)}))};
};
const demo=window.demo={calls,saved,sensors,windSensors,illuminanceSensors,admin:true,fail:false,failSave:false,failForecast:false,forecastDelay:0,locationDelay:0,noGps:sessionStorage.getItem('test-no-gps')==='1',radarToken:0,radarMode:'ok',radarDelay:0,radarFrameFailure:false,warningMode:'alerts',warningDelay:0,network:{home_ssids:sessionStorage.getItem('test-home-ssid-configured')==='1'?['Home WiFi']:[]},networkDelay:Number(sessionStorage.getItem('test-network-delay')||0),failNetworkCheck:sessionStorage.getItem('test-network-error')==='1',forecastStale:false,failEntity:null,gapEntity:null,empty:false,delayNext:0};

 calls.push(structuredClone(msg));
 if(demo.fail)throw new Error('Verbindung unterbrochen – bitte erneut versuchen.');
 if(msg.type==='weather_analysis/network'){const data=networkFixture();if(demo.networkDelay)await new Promise(resolve=>setTimeout(resolve,demo.networkDelay));if(demo.failNetworkCheck)throw new Error('Network lookup unavailable');return data;}
 if(msg.type==='weather_analysis/location'){
  const home=hass.states['device_tracker.router_phone'].state==='home'||demo.network.home_ssids.includes(hass.states['sensor.phone_ssid'].state);
  const point='latitude' in msg?msg:(hass.states['device_tracker.phone']?.attributes||{}),location=home?{...locationFixture(),position_available:false,is_home:true,key:'home-wifi-67459',via:'home_wifi'}:demo.noGps&&!('latitude' in msg)?{...locationFixture(),position_available:false,is_home:false,key:'fallback-67459'}:locationFixture(point.latitude,point.longitude);
  if(demo.locationDelay)await new Promise(resolve=>setTimeout(resolve,demo.locationDelay));

 }
 if(msg.type==='weather_analysis/forecast'){if(demo.forecastDelay)await new Promise(resolve=>setTimeout(resolve,demo.forecastDelay));return demo.failForecast?{forecast:null,forecast_error:'Wetterdienst nicht erreichbar.'}:{forecast:{...forecastFixture(msg.as_of,locationFixture(msg.latitude,msg.longitude)),stale:demo.forecastStale},forecast_error:null};}
 if(msg.type==='weather_analysis/radar'){
  const place=await hass.callWS({type:'weather_analysis/location',...('latitude' in msg?{latitude:msg.latitude,longitude:msg.longitude}:{})});
  const now=Date.now()/1000,anchor=Math.floor(now/300)*300,end=Math.ceil((now+3600)/300)*300,latest=anchor-600;
  const frames=Array.from({length:(end-anchor+7200)/300+1},(_,i)=>({time:anchor-7200+i*300,reference:Math.min(anchor-7200+i*300,latest),kind:anchor-7200+i*300<=latest?'observation':'prediction'}));
  const status=demo.radarMode==='loading'?'loading':demo.radarMode==='error'?'error':place.location.country_code!=='de'?'outside':'ok';
  return {location:place.location,radar_error:null,radar:{status,token:'test-radar-'+(++demo.radarToken||1),now,frames:status==='ok'?frames:[],latest,zoom:msg.zoom,basemap:radarImages.maps[String(msg.zoom)]||{},error:status==='error'?'DWD-Radar nicht erreichbar.':null,context:JSON.stringify([place.location.latitude,place.location.longitude,msg.zoom])},credits:{dwd:'https://www.dwd.de/',map_label:'Natural Earth',map_url:'https://www.naturalearthdata.com/',license:'https://www.naturalearthdata.com/about/terms-of-use/'}};
 }
 if(msg.type==='weather_analysis/radar_image'){
  if(msg.kind!=='frame')throw new Error('Local map/legend do not require image requests');
  if(demo.radarDelay)await new Promise(r=>setTimeout(r,demo.radarDelay));
  if(demo.radarFrameFailure&&msg.kind==='frame')throw new Error('Radarbild nicht verfügbar.');
  return {image:radarImages[msg.kind==='frame'?'frame':msg.kind]};
 }
 if(msg.type==='weather_analysis/warnings'){

  const now=Date.now()/1000,alerts=demo.warningMode==='empty'?[]:[{id:'storm-warning',title:'Amtliche Warnung vor Sturmböen',event:'STURM',level:3,level_label:'Unwetter',start:now-3600,end:now+10800,area:'Gemeinde Testort',description:'Synthetische Warnung für die Prüfung.\nZweite Zeile.',instruction:'Testhinweis: Lose Gegenstände sichern.',upcoming:false},{id:'rain-warning',title:'Amtliche Warnung vor Dauerregen',event:'REGEN',level:2,level_label:'Markantes Wetter',start:now+3600,end:now+86400,area:'Gemeinde Testort',description:'Synthetische Vorhersagewarnung.',instruction:'Testhinweis: Hinweise beachten.',upcoming:true}];
  if(demo.warningDelay)await new Promise(resolve=>setTimeout(resolve,demo.warningDelay));
  return {location,source_url:'https://www.dwd.de/warnungen',warnings_error:demo.warningMode==='error'?'DWD nicht erreichbar.':null,warnings:demo.warningMode==='error'?null:{status:location.country_code==='de'?'ok':'outside',alerts:location.country_code==='de'?alerts:[],source:'Deutscher Wetterdienst (DWD)',source_url:'https://www.dwd.de/warnungen',updated_at:now,timezone:'Europe/Berlin'}};
 }

   const record=(first,last,hourly)=>({start:first,end:last,partial:last-first<(hourly?3600:10800),temperature:point('temperature',first,hourly).mean,temperature_min:point('temperature',first,hourly).min,temperature_max:point('temperature',first,hourly).max,wind_speed:point('wind',first,hourly).mean,wind_max:point('wind',first,hourly).max,estimated:true});
   return {...record(start,end,false),hours:Array.from({length:3},(_,j)=>record(start+j*3600,Math.min(end,start+(j+1)*3600),true)).filter(h=>h.end>h.start)};
  }).filter(slot=>slot.end>slot.start);
  return {date,timezone:'Europe/Berlin',as_of,sensors:values,errors,intervals};
 }
 if(msg.type==='weather_analysis/sensors')return {sensors:demo.empty?[]:sensors,wind_sensors:demo.empty?[]:windSensors,illuminance_sensors:demo.empty?[]:illuminanceSensors,admin:demo.admin,settings:saved.get(msg.card_id)||{},...networkFixture(),timezone:'Europe/Berlin',version:'1.16.1'};
