<!doctype html><html lang="de"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Weather Analysis – synthetische Testdaten</title>
<style>body{margin:16px;background:#f5f6f8;font-family:Arial,sans-serif}body.dark{background:#111827;--ha-card-background:#1f2937;--primary-text-color:#f1f5f9;--secondary-text-color:#b4bdcb;--divider-color:#374151;--input-fill-color:#111827;--primary-color:#50b5fa;--ha-card-border-color:#374151}weather-analysis-card{display:block;max-width:760px;margin:auto}body:not(.dark){--primary-color:#0288d1}</style>
<weather-analysis-card></weather-analysis-card>
<script type="module">
import '/custom_components/weather_analysis/frontend/weather-analysis-card.js';
const saved=new Map(),calls=[];
const sensors=[{entity_id:'sensor.garden',name:'Garten · Außentemperatur'},{entity_id:'sensor.north',name:'Nordseite'}];
const illuminanceSensors=[{entity_id:'sensor.lux',name:'Garten · Illumination'},{entity_id:'sensor.lux2',name:'Dach · Illumination'}];
const windSensors=[{entity_id:'sensor.wind',name:'Garten · Anemometer'},{entity_id:'sensor.wind2',name:'Dach · Anemometer'}];
const fixture=msg=>{
 const wind=msg.entity_id.startsWith('sensor.wind'),lux=msg.entity_id.startsWith('sensor.lux'),secondary=msg.entity_id.endsWith('2');
 const start=new Date(msg.start_date+'T00:00:00+01:00').getTime()/1000;
 const end=Math.min(Date.now()/1000,new Date(msg.end_date+'T23:59:59+01:00').getTime()/1000);
 const offset=msg.entity_id==='sensor.north'||secondary?4:0;
 let chart=Array.from({length:24},(_,i)=>({start:start+(end-start)*i/24,end:start+(end-start)*(i+1)/24,mean:8+offset+4*Math.sin(i/5),min:6+offset+4*Math.sin(i/5),max:10+offset+4*Math.sin(i/5)}));
 if(demo.gapEntity===msg.entity_id)chart=chart.filter((point,index)=>index<5||index>8);
 const days=Array.from({length:Math.min(31,Math.max(1,Math.ceil((end-start)/86400)))},(_,i)=>{const d=new Date(start*1000+i*86400000);return {date:new Intl.DateTimeFormat('en-CA',{timeZone:'Europe/Berlin'}).format(d),seconds:86400,mean:8+i/10,min:-2+i/10,max:26+i/10,complete:true};});
 return {version:'1.4.1',kind:wind?'wind':lux?'illuminance':'temperature',unit:wind?'km/h':lux?'lx':'°C',entity_id:msg.entity_id,name:[...sensors,...windSensors,...illuminanceSensors].find(s=>s.entity_id===msg.entity_id)?.name||'Garten',timezone:'Europe/Berlin',current:wind?(secondary?28.8:18):lux?(secondary?3456.7:1234.6):11.4,last_updated:Date.now()/1000,start,end,partial:true,
  summary:{mean:lux?35.4:8.1+offset,min:lux?12.4:-2+offset,max:lux?56.6:26+offset,range:lux?44.2:28,min_at:start+3600,max_at:start+18000,estimated:true,seconds:end-start,exact_seconds:3600,coverage:.97,duration_coverage:.42,frost_hours:2.3,warm_hours:.6,hot_hours:0,frost_days:1,warm_days:1,hot_days:0,heating_degree_days:24.7,heating_days:2,days},chart,chart_daily:end-start>3*86400,
  comparisons:{previous:{mean:7.3,coverage:.97,delta:.8},year:{mean:9.4,coverage:.94,delta:-1.3}},trends:{hour:.8,three_hours:1.6,yesterday:-1.2},records:{min:{value:-12.3,at:null},max:{value:37.2,at:start-86400}},archive_since:start};
};
const demo=window.demo={calls,saved,sensors,windSensors,illuminanceSensors,admin:true,fail:false,failSave:false,failEntity:null,gapEntity:null,empty:false,delayNext:0};
const hass=demo.hass={states:{'sensor.garden':{entity_id:'sensor.garden',state:'11.4',last_updated:new Date().toISOString(),attributes:{friendly_name:sensors[0].name,unit_of_measurement:'°C'}},'sensor.lux2':{entity_id:'sensor.lux2',state:'3456.7',attributes:{friendly_name:'Dach · Illumination',device_class:'illuminance',unit_of_measurement:'lx'}},'sensor.wind2':{entity_id:'sensor.wind2',state:'8',attributes:{friendly_name:'Dach · Anemometer',device_class:'wind_speed',unit_of_measurement:'m/s'}},'sensor.lux':{entity_id:'sensor.lux',state:'1234',attributes:{friendly_name:illuminanceSensors[0].name,device_class:'illuminance',unit_of_measurement:'lx'}},'sensor.wind':{entity_id:'sensor.wind',state:'5',attributes:{friendly_name:windSensors[0].name,device_class:'wind_speed',unit_of_measurement:'m/s'}},'sensor.north':{entity_id:'sensor.north',state:'9.7',attributes:{friendly_name:'Nordseite',unit_of_measurement:'°C'}}},async callWS(msg){
 calls.push(structuredClone(msg));
 if(demo.fail)throw new Error('Verbindung unterbrochen – bitte erneut versuchen.');
 if(msg.type==='weather_analysis/sensors')return {sensors:demo.empty?[]:sensors,wind_sensors:demo.empty?[]:windSensors,illuminance_sensors:demo.empty?[]:illuminanceSensors,admin:demo.admin,settings:saved.get(msg.card_id)||{},timezone:'Europe/Berlin',version:'1.4.1'};
 if(msg.type==='weather_analysis/import_history')return {count:Object.entries(saved.get(msg.card_id)||{}).filter(([key])=>['entities','wind_entities','illuminance_entities'].includes(key)).reduce((n,[,entities])=>n+entities.length,0),failed:[]};
 if(msg.type==='weather_analysis/save_card'){if(!demo.admin)throw new Error('Keine Berechtigung');if(demo.failSave)throw new Error('Speichern fehlgeschlagen.');const settings={...msg};delete settings.type;delete settings.card_id;saved.set(msg.card_id,settings);return settings;}
 if(msg.type==='weather_analysis/analyse'){if(msg.entity_id===demo.failEntity)throw new Error('Kein Zugriff auf Vergleichssensor');const wait=demo.delayNext;demo.delayNext=0;if(wait)await new Promise(resolve=>setTimeout(resolve,wait));return fixture(msg);}
 throw new Error('Unknown command');
}};
const card=demo.card=document.querySelector('weather-analysis-card');
demo.config={type:'custom:weather-analysis-card',card_id:'test-garden',entity:'sensor.garden',title:'Gartenwetter'};
card.setConfig(demo.config);card.hass=hass;
</script></html>
