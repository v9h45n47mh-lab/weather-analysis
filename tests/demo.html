<!doctype html><html lang="de"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Weather Analysis – synthetische Testdaten</title>
<style>body{margin:16px;background:#f5f6f8;font-family:Arial,sans-serif}body.dark{background:#111827;--ha-card-background:#1f2937;--primary-text-color:#f1f5f9;--secondary-text-color:#b4bdcb;--divider-color:#374151;--input-fill-color:#111827;--primary-color:#50b5fa;--ha-card-border-color:#374151}weather-analysis-card{display:block;max-width:760px;margin:auto}body:not(.dark){--primary-color:#0288d1}</style>
<weather-analysis-card></weather-analysis-card>
<script type="module">
import '/custom_components/weather_analysis/frontend/weather-analysis-card.js';
const saved=new Map(),calls=[];
const sensors=[{entity_id:'sensor.garden',name:'Garten · Außentemperatur'},{entity_id:'sensor.north',name:'Nordseite'}];
const illuminanceSensors=[{entity_id:'sensor.lux',name:'Garten · Illumination'},{entity_id:'sensor.lux2',name:'Dach · Illumination'}];
const windSensors=[{entity_id:'sensor.wind',name:'Garten · Anemometer'},{entity_id:'sensor.wind2',name:'Dach · Anemometer'}];
const fixture=msg=>{
 const wind=msg.entity_id.startsWith('sensor.wind'),lux=msg.entity_id.startsWith('sensor.lux'),secondary=msg.entity_id.endsWith('2');
 let start=new Date(msg.start_date+'T00:00:00+01:00').getTime()/1000;
 let requestedEnd=new Date(msg.end_date+'T00:00:00+01:00').getTime()/1000+86400;
 if(msg.window==='week')requestedEnd=Math.floor(Math.min(msg.as_of??Date.now()/1000,Date.now()/1000)/60)*60+60;
 const end=Math.min(Date.now()/1000,requestedEnd,msg.as_of??Infinity);
 const interval=msg.chart_interval||(requestedEnd-start>4*86400?86400:3600),count=Math.ceil((end-start)/interval);
 const offset=msg.entity_id==='sensor.north'||secondary?4:0;
 let chart=Array.from({length:count},(_,i)=>({start:start+interval*i,end:Math.min(end,start+interval*(i+1)),resolution:interval,mean:8+offset+4*Math.sin(i/5),min:6+offset+4*Math.sin(i/5),max:10+offset+4*Math.sin(i/5)}));
 if(demo.gapEntity===msg.entity_id)chart=chart.filter((point,index)=>index<5||index>8);
 const days=Array.from({length:Math.min(31,Math.max(1,Math.ceil((end-start)/86400)))},(_,i)=>{const d=new Date(start*1000+i*86400000);return {date:new Intl.DateTimeFormat('en-CA',{timeZone:'Europe/Berlin'}).format(d),seconds:86400,mean:8+i/10,min:-2+i/10,max:26+i/10,complete:true};});
 return {version:'1.10.0',kind:wind?'wind':lux?'illuminance':'temperature',unit:wind?'km/h':lux?'lx':'°C',entity_id:msg.entity_id,name:[...sensors,...windSensors,...illuminanceSensors].find(s=>s.entity_id===msg.entity_id)?.name||'Garten',timezone:'Europe/Berlin',current:wind?(secondary?28.8:18):lux?(secondary?3456.7:1234.6):11.4,last_updated:Date.now()/1000,start,end,display_end:requestedEnd,window:msg.window||null,partial:end<requestedEnd,
  summary:{mean:lux?35.4:8.1+offset,min:lux?12.4:-2+offset,max:lux?56.6:26+offset,range:lux?44.2:28,min_at:start+3600,max_at:start+18000,estimated:true,seconds:end-start,exact_seconds:3600,coverage:.97,duration_coverage:.42,frost_hours:2.3,warm_hours:.6,hot_hours:0,frost_days:1,warm_days:1,hot_days:0,heating_degree_days:24.7,heating_days:2,days},chart,chart_daily:interval===86400,chart_interval:interval,chart_fallback:false,
  comparisons:{previous:{mean:7.3,coverage:.97,delta:.8},year:{mean:9.4,coverage:.94,delta:-1.3}},trends:{hour:.8,three_hours:1.6,yesterday:-1.2},records:{min:{value:-12.3,at:null},max:{value:37.2,at:start-86400}},archive_since:start};
};
const forecastFixture=(as_of=Date.now()/1000)=>{
 const current=new Date(as_of*1000),today=new Intl.DateTimeFormat('en-CA',{timeZone:'Europe/Berlin'}).format(current);
 const midnight=new Date(today+'T00:00:00+01:00').getTime()/1000,now=as_of;
 return {location:{postal_code:'67459',name:'Böhl-Iggelheim'},timezone:'Europe/Berlin',source:'Open-Meteo',source_url:'https://open-meteo.com/',as_of:now,updated_at:Date.now()/1000,stale:false,
  days:[0,1].map(offset=>({date:new Date((midnight+offset*86400+43200)*1000).toISOString().slice(0,10),label:offset?'Morgen':'Heute · Resttag',slots:Array.from({length:8},(_,i)=>{const start=midnight+offset*86400+i*10800,end=start+10800;return {start:Math.max(start,now),end,partial:start<now,temperature:8+i/2,temperature_min:7+i/2,temperature_max:10+i/2,apparent_temperature:6+i/2,humidity:87,pressure:1013,wind_direction:225,wind_gusts:42,weather_code:i%2?2:61,is_day:i>=2&&i<6,condition:i%2?'Wolkig':'Leichter Regen',icon:i%2?'mdi:weather-cloudy':'mdi:weather-rainy',precipitation:i%2?0:.6,precipitation_probability:i%2?20:60,wind_speed:12+i};}).filter(slot=>slot.end>now)}))};
};
const demo=window.demo={calls,saved,sensors,windSensors,illuminanceSensors,admin:true,fail:false,failSave:false,failForecast:false,forecastDelay:0,forecastStale:false,failEntity:null,gapEntity:null,empty:false,delayNext:0};
const hass=demo.hass={states:{'sensor.garden':{entity_id:'sensor.garden',state:'11.4',last_updated:new Date().toISOString(),attributes:{friendly_name:sensors[0].name,unit_of_measurement:'°C'}},'sensor.lux2':{entity_id:'sensor.lux2',state:'3456.7',attributes:{friendly_name:'Dach · Illumination',device_class:'illuminance',unit_of_measurement:'lx'}},'sensor.wind2':{entity_id:'sensor.wind2',state:'8',attributes:{friendly_name:'Dach · Anemometer',device_class:'wind_speed',unit_of_measurement:'m/s'}},'sensor.lux':{entity_id:'sensor.lux',state:'1234',attributes:{friendly_name:illuminanceSensors[0].name,device_class:'illuminance',unit_of_measurement:'lx'}},'sensor.wind':{entity_id:'sensor.wind',state:'5',attributes:{friendly_name:windSensors[0].name,device_class:'wind_speed',unit_of_measurement:'m/s'}},'sensor.north':{entity_id:'sensor.north',state:'9.7',attributes:{friendly_name:'Nordseite',unit_of_measurement:'°C'}}},async callWS(msg){
 calls.push(structuredClone(msg));
 if(demo.fail)throw new Error('Verbindung unterbrochen – bitte erneut versuchen.');
 if(msg.type==='weather_analysis/forecast'){if(demo.forecastDelay)await new Promise(resolve=>setTimeout(resolve,demo.forecastDelay));return demo.failForecast?{forecast:null,forecast_error:'Wetterdienst nicht erreichbar.'}:{forecast:{...forecastFixture(msg.as_of),stale:demo.forecastStale},forecast_error:null};}
 if(msg.type==='weather_analysis/dashboard'){
  const as_of=msg.as_of??Date.now()/1000,date=new Intl.DateTimeFormat('en-CA',{timeZone:'Europe/Berlin'}).format(new Date(as_of*1000)),values={},errors={};
  for(const kind of ['temperature','wind','illuminance']){const entity=msg[kind+'_entity'];if(!entity)continue;if(entity===demo.failEntity){errors[kind]='Sensor nicht verfügbar.';continue;}const data=fixture({entity_id:entity,start_date:date,end_date:date,chart_interval:10800,as_of});values[kind]={entity_id:entity,current:data.current,unit:data.unit,updated_at:data.last_updated,chart:data.chart,min:data.summary.min,max:data.summary.max,min_at:data.summary.min_at,max_at:data.summary.max_at};}
  const midnight=new Date(date+'T00:00:00+01:00').getTime()/1000;
  const intervals=Array.from({length:8},(_,i)=>{const start=midnight+i*10800,end=Math.min(as_of,start+10800),point=kind=>values[kind]?.chart?.find(p=>p.start===start)||{};return {start,end,partial:end<start+10800,temperature:point('temperature').mean,temperature_min:point('temperature').min,temperature_max:point('temperature').max,wind_speed:point('wind').mean,wind_max:point('wind').max,illuminance:point('illuminance').mean,estimated:false};}).filter(slot=>slot.end>slot.start);
  return {date,timezone:'Europe/Berlin',as_of,sensors:values,errors,intervals};
 }
 if(msg.type==='weather_analysis/sensors')return {sensors:demo.empty?[]:sensors,wind_sensors:demo.empty?[]:windSensors,illuminance_sensors:demo.empty?[]:illuminanceSensors,admin:demo.admin,settings:saved.get(msg.card_id)||{},timezone:'Europe/Berlin',version:'1.10.0'};
 if(msg.type==='weather_analysis/import_history')return {count:Object.entries(saved.get(msg.card_id)||{}).filter(([key])=>['entities','wind_entities','illuminance_entities'].includes(key)).reduce((n,[,entities])=>n+entities.length,0),failed:[]};
 if(msg.type==='weather_analysis/save_card'){if(!demo.admin)throw new Error('Keine Berechtigung');if(demo.failSave)throw new Error('Speichern fehlgeschlagen.');const settings={...msg};delete settings.type;delete settings.card_id;saved.set(msg.card_id,settings);return settings;}
 if(msg.type==='weather_analysis/analyse'){if(msg.entity_id===demo.failEntity)throw new Error('Kein Zugriff auf Vergleichssensor');const wait=demo.delayNext;demo.delayNext=0;if(wait)await new Promise(resolve=>setTimeout(resolve,wait));return fixture(msg);}
 throw new Error('Unknown command');
}};
const card=demo.card=document.querySelector('weather-analysis-card');
demo.config={type:'custom:weather-analysis-card',card_id:'test-garden',entity:'sensor.garden',title:'Gartenwetter'};
card.setConfig(demo.config);card.hass=hass;
</script></html>
