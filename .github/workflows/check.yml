name: Check
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  home-assistant:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Run in official Home Assistant image
        run: docker run --rm --entrypoint python -v "$PWD:/work" -w /work ghcr.io/home-assistant/home-assistant:2026.10.0 scripts/ha_smoke.py
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - run: npm run build && npm run check && npm test
      - name: Check live weather provider
        continue-on-error: true
        run: python3 scripts/forecast_live.py
      - name: Check live place provider
        continue-on-error: true
        run: python3 scripts/location_live.py
      - name: Check live DWD warning provider
        continue-on-error: true
        run: python3 scripts/dwd_live.py
      - name: Check live DWD radar and BKG map
        continue-on-error: true
        run: python3 scripts/radar_live.py
      - run: npm run test:browser
      - run: npm run package
      - uses: actions/upload-artifact@v4
        with:
          name: weather-analysis
          path: dist/*.zip
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-results
          path: test-results/
  publish:
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[publish-temperature]') }}
    needs: [test, home-assistant]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python3 scripts/package.py
      - name: Publish verified release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_COMMIT: ${{ github.sha }}
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          version=json.loads(Path('package.json').read_text())['version']
          section=Path('CHANGELOG.md').read_text().split('## '+version+'\n',1)[1].split('\n## ',1)[0].strip()
          Path('/tmp/temperature-release-notes.md').write_text(section+'\n')
          PY
          version="$(python3 -c "import json; print(json.load(open('package.json'))['version'])")"
          gh release create "v${version}" dist/*.zip --target "$RELEASE_COMMIT" --title "Weather Analysis ${version}" --notes-file /tmp/temperature-release-notes.md
