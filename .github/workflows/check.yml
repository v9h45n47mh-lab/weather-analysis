name: Check
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  home-assistant:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Run in official Home Assistant image
        run: docker run --rm --entrypoint python -v "$PWD:/work" -w /work ghcr.io/home-assistant/home-assistant:2026.10.0 scripts/ha_smoke.py
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - run: npm run build && npm run check && npm test
      - run: npm run test:browser
      - run: npm run package
      - uses: actions/upload-artifact@v4
        with:
          name: weather-analysis
          path: dist/*.zip
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-results
          path: test-results/
